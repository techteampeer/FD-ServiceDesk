name: Deploy FDNY Kiosk Service to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: itservicedesk-502618
  REGION: us-central1
  SERVICE_NAME: fdny-itsm-service

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Container to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --set-env-vars GLPI_BASE_URL="https://glpi.peer-consulting.com/apirest.php",GLPI_ENTITY_ID="1",GOOGLE_CLOUD_PROJECT="itservicedesk-502618",VERTEX_LOCATION="us-central1",VERTEX_MODEL="gemini-1.5-flash" \
            --set-secrets GLPI_APP_TOKEN=GLPI_APP_TOKEN:latest,GLPI_USER_TOKEN=GLPI_USER_TOKEN:latest